<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">MicroBiomica Lab logo</title>
  <desc id="desc">A clean Helvetica-based wordmark with a microbiome-style node icon.</desc>
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123c43"/>
      <stop offset="100%" stop-color="#007c7a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="none"/>
  <g transform="translate(36 30)">
    <g transform="translate(0 36)">
      <circle cx="70" cy="75" r="10" fill="#123c43"/>
      <circle cx="132" cy="42" r="9" fill="#007c7a"/>
      <circle cx="176" cy="82" r="8" fill="#79b76d"/>
      <circle cx="150" cy="140" r="11" fill="#4c8fd8"/>
      <circle cx="88" cy="155" r="8" fill="#79b76d"/>
      <circle cx="47" cy="122" r="9" fill="#007c7a"/>
      <circle cx="120" cy="98" r="19" fill="url(#iconGrad)" opacity=".14"/>
      <path d="M70 75 L132 42 L176 82 L150 140 L88 155 L47 122 Z" fill="none" stroke="#007c7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
      <path d="M70 75 L120 98 L150 140" fill="none" stroke="#123c43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
      <path d="M47 122 L120 98 L176 82" fill="none" stroke="#79b76d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    </g>
  </g>
  <g transform="translate(260 84)">
    <text x="0" y="0"
